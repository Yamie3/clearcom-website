{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ClearCom Solutions Group{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% block meta_description %}
  <meta name="description" content="ClearCom Solutions Group (CSG) builds accountability and governance technology that helps organizations turn insight into action.">
  {% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

<header class="site-header">
  <div class="container">
    <h1 class="logo">ClearCom Solutions Group</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/steward/">Steward</a>
      <a href="/pricing/">Pricing</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>© {% now "Y" %} ClearCom Solutions Group. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
