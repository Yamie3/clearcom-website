{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ClearCom Solutions{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="{% block meta_description %}
  ClearCom Solutions builds practical governance and accountability technology that helps organizations turn insight into action.
  {% endblock %}">

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

<header class="site-header">
  <div class="container">
    <h1 class="logo">ClearCom Solutions</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/steward/">Steward</a>
      <a href="/pricing/">Pricing</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>© {% now "Y" %} ClearCom Solutions. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
